/**:
  ros__parameters:
    visualize: false

    # Topics for all lidars (used for live ROS subscription mode)
    lidar_topics: [lidar_1, lidar_2]

    # path for point clouds in pcd format. Structure: /pcd_directory/<lidar_name>.pcd
    pcd_directory: /../data/drone_to_rover_calibration/

    # logging output
    results_file: calibration_result.txt

    # calibration results are stored here (path relative to the dir with multi_lidar_calibrator.py)
    output_dir: /../data/

