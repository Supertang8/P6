ekf_filter_node_global:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 1.0
    two_d_mode: false

    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ---- FastLIO pose ----
    odom0: /Odometry
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
