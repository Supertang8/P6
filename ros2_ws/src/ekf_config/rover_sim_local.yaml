ekf_filter_node_local:
  ros__parameters:
    frequency: 100.0
    sensor_timeout: 0.1
    two_d_mode: false

    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ---- IMU 1 ----
    imu0: /livox/imu
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true

    # ---- IMU 2 ----
    imu1: /imu/data_raw
    imu1_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]
    imu1_differential: false
    imu1_remove_gravitational_acceleration: true

    # ---- Wheel odometry ----
    odom0: /rover_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
