ekf_filter_node_global:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 1.0
    two_d_mode: false

    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # ---- FastLIO pose ----
    odom0: /rover/Odometry
    odom0_config: [true,  true,  true,
                   true,  true,  true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false

    # ---- IMU ----
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_remove_gravitational_acceleration: false
