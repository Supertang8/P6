ekf_filter_node:
  ros__parameters:
    frequency: 100.0
    sensor_timeout: 0.3
    two_d_mode: false
    use_control: false

    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: livox
    world_frame: odom
    base_link_output_frame: livox

    # ---- FastLIO pose ----
    odom0: /Odometry
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  true,
                   true,  true,  true,
                   false, false, false]
    odom0_differential: false

    odom1: /rover_odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  true,
                   true,  true,  true,
                   false, false, false]
    odom1_differential: true

    # ---- IMU pose ----
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                   true,  true,  true,
                   false, false, false,
                   true,  true,  true,
                   true,  true,  true]
    imu0_differential: true
    imu0_remove_gravitational_acceleration: true

    imu1: /livox/imu
    imu1_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]
    imu1_differential: true
    imu1_remove_gravitational_acceleration: true