amcl:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # Robot limits (adjust later for Leorover)
      max_vel_x: 0.5
      min_vel_x: 0.0
      max_vel_theta: 1.0

      acc_lim_x: 1.0
      acc_lim_theta: 2.0

      # Goal tolerances
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.2

      # Prevent oscillation
      prune_plan: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true
      width: 4.0
      height: 4.0
      resolution: 0.1

      plugins: ["inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: camera_init
      robot_base_frame: base_link
      resolution: 0.1

      track_unknown_space: true

      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /octomap_full
        subscribe_to_updates: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"

recoveries_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: global_costmap/costmap_raw

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]
