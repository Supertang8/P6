services:
  drone:
    build: .
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ./ros2_drone_ws:/root/ros2_drone_ws
      - type: bind
        source: ./../../ros2_drone_ws
        target: /root/ros2_drone_ws
    restart: unless-stopped
    stdin_open: true
    tty: true
    devices:
      - "/dev/ttyAMA0:/dev/ttyAMA0"
      - "/dev/ttyACM0:/dev/ttyACM0"
