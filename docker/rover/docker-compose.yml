services:
  rover:
    build: 
      context: ../..
      dockerfile: ./docker/rover/Dockerfile
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ./ros2_ws:/root/ros2_ws
      - type: bind
        source: ./../../ros2_ws
        target: /root/ros2_ws
    restart: unless-stopped
    stdin_open: true
    tty: true
    devices:
      - "/dev/serial0:/dev/serial0"
